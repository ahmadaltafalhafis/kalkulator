<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Kalkulator Polos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    .kalkulator {
      width: 220px;
      border: 1px solid #999;
      padding: 10px;
      background-color: #f4f4f4;
    }

    #layar {
      width: 100%;
      height: 35px;
      font-size: 18px;
      text-align: right;
      margin-bottom: 10px;
      padding: 4px;
      box-sizing: border-box;
    }

    .tombol {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    button {
      height: 40px;
      font-size: 16px;
      cursor: pointer;
    }

    .lebar {
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <div class="kalkulator">
    <input type="text" id="layar" readonly />
    <div class="tombol">
      <button class="lebar" onclick="hapus()">C</button>
      <button onclick="tambah('/')">/</button>
      <button onclick="tambah('*')">*</button>

      <button onclick="tambah('7')">7</button>
      <button onclick="tambah('8')">8</button>
      <button onclick="tambah('9')">9</button>
      <button onclick="tambah('-')">-</button>

      <button onclick="tambah('4')">4</button>
      <button onclick="tambah('5')">5</button>
      <button onclick="tambah('6')">6</button>
      <button onclick="tambah('+')">+</button>

      <button onclick="tambah('1')">1</button>
      <button onclick="tambah('2')">2</button>
      <button onclick="tambah('3')">3</button>
      <button onclick="hitung()">=</button>

      <button class="lebar" onclick="tambah('0')">0</button>
      <button class="lebar" onclick="tambah('.')">.</button>
    </div>
  </div>

  <script>
    const layar = document.getElementById("layar");

    function tambah(nilai) {
      layar.value += nilai;
    }

    function hapus() {
      layar.value = "";
    }

    function hitung() {
      try {
        layar.value = eval(layar.value) || "";
      } catch {
        layar.value = "Error";
      }
    }
  </script>

</body>
</html>
